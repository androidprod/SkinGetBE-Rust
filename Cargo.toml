[package]
name = "skingetbe"
version = "0.1.0"
edition = "2021"
authors = ["droidprod"]
description = "Minecraft Bedrock Edition skin data extraction tool"
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Base64
base64 = "0.21"

# Compression
flate2 = "1.0"
crc32fast = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
