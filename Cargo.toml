[package]
name = "skingetbe"
version = "0.1.0"
edition = "2021"
authors = ["droidprod"]
description = "Minecraft Bedrock Edition skin data extraction tool"
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
bytes = "1.5"
thiserror = "1.0"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography & Security
jsonwebtoken = "9.2"
sha2 = "0.10"
base64 = "0.21"
rustls = "0.21"
once_cell = "1.21"

# Compression
flate2 = "1.0"
zstd = "0.13"

# PNG support
png = "0.17"
crc32fast = "1.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
log = "0.4"
env_logger = "0.11"

# Utilities
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# Platform-specific
cfg-if = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["net"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
