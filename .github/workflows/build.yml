name: Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

      release_title:
        description: 'Release title'
        required: false
        default: ''

      pre_release:
        description: 'Pre-release'
        required: true
        type: boolean
        default: false

      draft:
        description: 'Draft release'
        required: true
        type: boolean
        default: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            os_name: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            binary: skingetbe.exe
            asset: SkinGetBE_windows_x64.zip

          # Linux x64
          - os: ubuntu-latest
            os_name: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            binary: skingetbe
            asset: SkinGetBE_linux_x64.tar.gz

          # Linux arm64
          - os: ubuntu-latest
            os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            binary: skingetbe
            asset: SkinGetBE_linux_arm64.tar.gz

          # macOS x64
          - os: macos-13
            os_name: macos
            arch: x64
            target: x86_64-apple-darwin
            binary: skingetbe
            asset: SkinGetBE_macos_x64.tar.gz

          # macOS arm64
          - os: macos-latest
            os_name: macos
            arch: arm64
            target: aarch64-apple-darwin
            binary: skingetbe
            asset: SkinGetBE_macos_arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # Linux arm64 cross
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Standard build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          FILE="target/${{ matrix.target }}/release/${{ matrix.binary }}"

          if [ ! -f "$FILE" ]; then
            echo "Binary missing: $FILE"
            exit 1
          fi

          ls -lh "$FILE"

      - name: Strip binary
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary }} || true

      # Package Windows
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          mkdir dist

          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            "dist/skingetbe.exe"

          Compress-Archive `
            -Path dist/* `
            -DestinationPath "${{ matrix.asset }}"

      # Package Unix
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist

          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "dist/skingetbe"

          tar -czf "${{ matrix.asset }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format
        run: cargo fmt -- --check

  release:
    name: Release
    runs-on: ubuntu-latest

    needs:
      - build
      - test

    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir final

          find release-assets -type f | while read file; do
            cp "$file" final/
          done

          ls -lah final

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "${{ github.event.inputs.release_tag }}"
          git push origin "${{ github.event.inputs.release_tag }}"

      - name: Generate release name
        id: rel
        run: |
          TITLE="${{ github.event.inputs.release_title }}"

          if [ -z "$TITLE" ]; then
            TITLE="Release ${{ github.event.inputs.release_tag }}"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ steps.rel.outputs.title }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.pre_release }}

          files: |
            final/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
