name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: false
        default: ''
      release_title:
        description: 'Release title (leave empty for auto-generated)'
        required: false
        default: ''
      pre_release:
        description: 'Mark as pre-release'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      draft:
        description: 'Create as draft'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (x64)
          - os: windows-latest
            os_name: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            binary: skingetbe.exe
            package_name: SkinGetBE_windows_x64.exe
            
          # Linux (x64)
          - os: ubuntu-latest
            os_name: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            binary: skingetbe
            package_name: SkinGetBE_linux_x64
            
          # Linux (arm64)
          - os: ubuntu-latest
            os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            binary: skingetbe
            package_name: SkinGetBE_linux_arm64
            
          # macOS (x64)
          - os: macos-latest
            os_name: macos
            arch: x64
            target: x86_64-apple-darwin
            binary: skingetbe
            package_name: SkinGetBE_macos_x64
            
          # macOS (arm64)
          - os: macos-latest
            os_name: macos
            arch: arm64
            target: aarch64-apple-darwin
            binary: skingetbe
            package_name: SkinGetBE_macos_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross (for arm64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (with cross for arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (standard)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check binary exists (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if (-Not (Test-Path $binary)) {
            Write-Error "Binary not found: $binary"
            exit 1
          }
          Write-Output "Binary location: $(Get-Item $binary | Select-Object -ExpandProperty FullName)"
          Write-Output "Binary size: $((Get-Item $binary).Length / 1MB) MB"

      - name: Check binary exists (Unix)
        if: runner.os != 'Windows'
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ ! -f "$binary" ]; then
            echo "Binary not found: $binary"
            exit 1
          fi
          ls -lh "$binary"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.package_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 30

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  release:
    name: Create Release
    needs: [ build, test ]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Determine release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual workflow dispatch
            if [ -z "${{ github.event.inputs.release_tag }}" ]; then
              echo "skip_release=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            RELEASE_NAME="${{ github.event.inputs.release_title }}"
            PRE_RELEASE="${{ github.event.inputs.pre_release }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            # Tag push
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            RELEASE_NAME="Release ${RELEASE_TAG}"
            PRE_RELEASE="$([[ "$RELEASE_TAG" =~ alpha|beta|rc ]] && echo 'true' || echo 'false')"
            DRAFT="false"
          fi
          
          # Auto-generate release name if not provided
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="Release ${RELEASE_TAG}"
          fi
          
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "pre_release=${PRE_RELEASE}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT}" >> $GITHUB_OUTPUT
          echo "skip_release=false" >> $GITHUB_OUTPUT

      - name: Collect packaged assets
        if: steps.release_info.outputs.skip_release == 'false'
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name 'SkinGetBE_*' -o -name 'skingetbe*' \) -print0 | while IFS= read -r -d '' file; do
            asset_name=$(basename "$(dirname "$file")")
            cp "$file" "release-assets/${asset_name}"
          done

      - name: Generate release notes from changelog
        if: steps.release_info.outputs.skip_release == 'false'
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            # Extract version-specific changelog
            changelog=$(sed -n "/^## \[${{ steps.release_info.outputs.tag }}\]/,/^## \[/p" CHANGELOG.md | head -n -1)
            if [ -z "$changelog" ]; then
              # Fallback to latest entry
              changelog=$(sed -n '/^## \[/,/^## \[/p' CHANGELOG.md | head -n -1)
            fi
          else
            changelog="See commit history for changes"
          fi

          changelog="${changelog//'%'/'%25'}"
          changelog="${changelog//$'\n'/'%0A'}"
          changelog="${changelog//$'\r'/'%0D'}"

          echo "body=${changelog}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.release_info.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: ${{ steps.release_info.outputs.draft }}
          prerelease: ${{ steps.release_info.outputs.pre_release }}
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.body }}
          files: |
            release-assets/SkinGetBE_windows_x64.exe
            release-assets/SkinGetBE_linux_x64
            release-assets/SkinGetBE_linux_arm64
            release-assets/SkinGetBE_macos_x64
            release-assets/SkinGetBE_macos_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
